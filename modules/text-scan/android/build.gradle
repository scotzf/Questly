plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.textscan'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.textscan"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled Latin model: works offline, no Play Services download needed.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
